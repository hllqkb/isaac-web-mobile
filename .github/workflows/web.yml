            await warmPage.setContent('<div id="overlay">original</div>');
            const warmUi=await warmPage.evaluate(async()=>{const {prepareResources}=await import('/web/preload.mjs');await prepareResources();return document.querySelectorAll('section[aria-label="准备游戏资源"]').length;});
            assert.equal(warmUi,0);assert.equal(await warmPage.evaluate(()=>window.__warmConcurrency),16);await warmPage.close();
            console.log('PREPARED GAME WARM CHECK DOES NOT SHOW A SECOND DOWNLOAD PANEL');
            const hosted=fs.readFileSync('dist/game.html','utf8');
            const loader=hosted.match(/<script>(if\(new URLSearchParams[\s\S]*?)<\/script>/)[1];
            for(const failure of ['entry','dependency']){
              const retryPage=await browser.newPage();let entryRequests=0;
              const fixture='<script>window.__isaacPortableData={hostedFullCache:true};window.__launched=false;</script><script>'+loader+'</script><script>window.isaacFullCacheReady.then(()=>{window.__launched=true;});</script>';
              await retryPage.route('**/loader-fixture.html',route=>route.fulfill({contentType:'text/html',body:fixture}));
              if(failure==='entry')await retryPage.route('**/web/preload.mjs',route=>{
                entryRequests++;
                return entryRequests===1?route.fulfill({status:404,body:'module unavailable'}):route.fulfill({contentType:'text/javascript',body:'export async function prepareResources(){window.__retried=true;}'});
              });
              else await retryPage.route('**/web/chunk_cache.mjs',route=>route.fulfill({status:404,body:'dependency unavailable'}));
              await retryPage.goto('http://127.0.0.1:8767/loader-fixture.html');
              await retryPage.locator('[data-preload-loader-error]').waitFor({state:'visible'});
              assert.equal(await retryPage.evaluate(()=>window.__launched),false);
              if(failure==='entry'){
                await Promise.all([retryPage.waitForNavigation(),retryPage.locator('[data-cache-reload]').click()]);
                await retryPage.waitForFunction(()=>window.__launched===true);
                assert.equal(entryRequests,2);
                assert.equal(await retryPage.evaluate(()=>window.__retried),true);
              }else{
                await retryPage.locator('[data-cache-online]').click();
                await retryPage.waitForFunction(()=>window.__launched===true);
                assert.ok(await retryPage.evaluate(()=>window.isaacFullChunkCache===null&&window.isaacPreloadCompatibility===true&&__isaacPortableData.hostedFullCache===false));
              }
              console.log('PRELOAD IMPORT FAILURE RECOVERS BEFORE GAME LAUNCH',failure);
              await retryPage.close();
            }
            for(const query of ['preload=off','preload=off&framepacer=off']){
              const bypass=await browser.newPage();let imports=0;
              const fixture='<script>window.__isaacPortableData={hostedFullCache:true};window.__launched=false;</script><script>'+loader+'</script><script>window.isaacFullCacheReady.then(()=>{window.__launched=true;});</script>';
              await bypass.route('**/loader-fixture.html*',route=>route.fulfill({contentType:'text/html',body:fixture}));
              await bypass.route('**/web/preload.mjs',route=>{imports++;return route.abort();});
              await bypass.goto('http://127.0.0.1:8767/loader-fixture.html?'+query);
              await bypass.waitForFunction(()=>window.__launched);
              assert.equal(imports,0);
              assert.ok(await bypass.evaluate(()=>__isaacPortableData.hostedFullCache===false&&isaacFullChunkCache===null));
              assert.equal(await bypass.locator('[data-preload-loader-error]').count(),0);
              assert.equal(await bypass.evaluate(()=>new URLSearchParams(location.search).get('framepacer')),query.includes('framepacer=off')?'off':null);
              console.log('PRELOAD BYPASS DOES NOT IMPORT OR BLOCK LAUNCH; PACING QUERY PRESERVED',query);
              await bypass.close();
            }
          }finally{await browser.close();}
