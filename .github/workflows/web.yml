              'repeated call is not patched':[CALLBACK_GUARD_SCRIPT,dispatch+'local result = v.Function(v.Mod, ...)\n',{},'unrecognised'],
              'invalid UTF-8 is written as shipped':[CALLBACK_GUARD_SCRIPT,null,{},'unrecognised'],
