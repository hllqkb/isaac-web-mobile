          console.log('PINNED RESOURCE AND MODULE CHECKS PASSED');
          JS
      - name: Verify transport failures, slow streams and immutable fallback
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {createResourceTransport} from './web/resource_transport.mjs';
