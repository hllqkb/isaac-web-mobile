              assert.equal(slept.busyMs.p50,20,'Native sleep counted as busy: '+JSON.stringify(slept.busyMs));
            }
            assert.deepEqual(perf.summary().engine,window.isaacFrameCost());
            perf.reset();assert.equal(window.isaacFrameCost().frames,0);
            console.log('FRAME COST RECORDER VERIFIED: busy/wait/draw split, pause exclusion, reset');
          }
          // Synthetic clock: this checks the JS pacer's call boundaries only.
          // Native render skips change the number of present/yield calls per game tick.
          // Do not infer NativeGameTick rate from the number of pace() calls.
          for(const syntheticInputHz of [60,90,120,144]) {
            let time=0;
