              return{runMods:run.mods,runBytes:Array.from(run.bytes),otherHasMods:'mods' in other};
            });
            if(JSON.stringify(tagged.runMods)!=='["eid"]'||tagged.runBytes[0]!==7||tagged.otherHasMods)
              throw Error('Run save did not keep its mods in the same record: '+JSON.stringify(tagged));
            console.log('RUN SAVE STORES ITS MODS WITH ITS BYTES',tagged);
            await context.close();
            if(errors.length)throw Error('Browser errors: '+errors.join('\n'));
          } finally {
            fs.writeFileSync('output/browser.log',errors.join('\n'));
            await browser.close();
