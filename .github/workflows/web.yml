          new=json.loads(re.search(pattern,hosted,re.S)[1])
          for before,after in zip(old['streams'],new['streams'],strict=True):
              assert after.get('base',new['base'])==f"./chunks/{before['tag']}"
              if 'base' in before: after['base']=before['base']
