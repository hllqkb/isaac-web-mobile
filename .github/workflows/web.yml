              const queue=[{key:'gamestate1.dat',src:'',bytes:new Uint8Array([7]),mods:['eid']},{key:'persistentgamedata1.dat',src:'',bytes:new Uint8Array([8])}];
              await createSaveWriter({store:'files',queue,database:()=>db}).flush();
