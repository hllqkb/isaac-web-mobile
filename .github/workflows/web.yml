            }
            console.log('CALLBACK GUARD PATCH VERIFIED');
          }
          assert.ok(modules['touch_controls.mjs'].includes("mobilePerformance.sample({...state,mode:mode==='off'&&run&&!state.paused?'game':mode,running:run});"),'Desktop gameplay is not sampled');
          {
