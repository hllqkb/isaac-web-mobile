name: Verify shared Isaac web updates
on:
  push:
    branches: ['site/mobile-*']
  workflow_dispatch:
    inputs:
      apk_url:
        description: Temporary download URL for the verified Android r2 APK
        required: false
        type: string
      source_url:
        description: Temporary download URL for the verified Android r2 source ZIP
        required: false
        type: string
permissions:
  contents: read
jobs:
  stage_android_release:
    if: github.event_name == 'workflow_dispatch' && inputs.apk_url != '' && inputs.source_url != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Copy verified Android r2 files into the release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh release view v2026.11.05-r2 --json isDraft --jq .isDraft)" = true
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen
          event=json.loads(Path(os.environ['GITHUB_EVENT_PATH']).read_text())
          files=[
              ('Isaac-Mobile-2026-11-05-r2.apk','apk_url','4bb8a11a92e25aa7efd4e9aa167ed458bcc90e9621b54cdd5c64230492dc1f98'),
              ('Isaac-Mobile-source-2026-11-05-r2.zip','source_url','713cf3303eda3e7b1f68492f6acca7a83c3964749805ffb3e88c7c37e7aa3f4d'),
          ]
          sums=[]
          for name,key,expected in files:
              address=event['inputs'][key]
              print('::add-mask::'+address,flush=True)
              parsed=urlsplit(address)
              host=parsed.hostname or ''
              assert parsed.scheme=='https' and (host.endswith('.githubusercontent.com') or host.endswith('.blob.core.windows.net'))
              digest=hashlib.sha256()
              with urlopen(Request(address,headers={'User-Agent':'Isaac-Release-Stager'}),timeout=120) as response,Path(name).open('wb') as output:
                  while block:=response.read(1024*1024):
                      output.write(block);digest.update(block)
              assert digest.hexdigest()==expected,'Release checksum mismatch: '+name
              sums.append(expected+'  '+name)
              print('VERIFIED RELEASE FILE',name,Path(name).stat().st_size,expected,flush=True)
          Path('SHA256SUMS').write_text('\n'.join(sums)+'\n')
          PY
          test "$(gh release view v2026.11.05-r2 --json isDraft --jq .isDraft)" = true
          gh release upload v2026.11.05-r2 --clobber Isaac-Mobile-2026-11-05-r2.apk Isaac-Mobile-source-2026-11-05-r2.zip SHA256SUMS
          gh api "repos/$GH_REPO/releases" --jq '.[]|select(.tag_name=="v2026.11.05-r2")|{id,tag_name,draft,assets:[.assets[]|{id,name,size,state,digest}]}'
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply shared patches without downloading game assets
        id: patch
        run: python3 scripts/patch_game.py
      - name: Verify module syntax, source identity and pacer call boundaries
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {spawnSync} from 'node:child_process';
          import {createFramePacer} from './mobile/frame_clock.mjs';
          const page=fs.readFileSync('game.html','utf8'),source=fs.readFileSync('upstream/game.html','utf8');
          const registry=text=>JSON.parse(text.match(/window\.__isaacModules = (.*?);<\/script>/s)[1]);
          const modules=registry(page);
          const manifest=text=>text.match(/window\.__isaacPortableData = (.*?);<\/script>/s)[1];
          if(manifest(page)!==manifest(source))throw Error('Pinned game resource manifest changed');
          if(!page.includes('isaac-shared-ready'))throw Error('First-run import gate disappeared');
          for(const [name,text] of Object.entries(modules)) {
            const checked=spawnSync(process.execPath,['--check','--input-type=module'],{input:text,encoding:'utf8'});
            if(checked.status!==0)throw Error(name+': '+checked.stderr);
          }
          for(const name of ['performance','console','buttons','frame_clock','boot_cache','save_guard','recovery','run_guard','script_fixes'])
            if(modules['mobile_'+name+'.mjs']!==fs.readFileSync('mobile/'+name+'.mjs','utf8'))throw Error('Stale mobile module '+name);
          const pacing=modules['boot_web.mjs'].match(/const cappedFramePacer=params.get\('framepacer'\)!=='off';cfg.isaacPaceFrame=cappedFramePacer\?createFramePacer\(\):null;window.isaacPacingMode=cappedFramePacer\?'capped60':'original-yield';/);
          assert.ok(pacing,'Explicit pacing switch not found');
          const configure=new Function('params','cfg','window','createFramePacer',pacing[0]);
          for(const [query,mode] of [['','capped60'],['framepacer=off','original-yield'],['framepacer=unknown','capped60']]) {
            const cfg={},window={},marker=()=>{},calls=[];
            configure(new URLSearchParams(query),cfg,window,()=>{calls.push('create');return marker;});
            assert.equal(window.isaacPacingMode,mode);
            assert.equal(cfg.isaacPaceFrame,mode==='capped60'?marker:null);
            assert.equal(calls.length,mode==='capped60'?1:0);
          }
          // Removing the optional call must recover the exact pinned yield implementation.
          const yieldText=text=>text.slice(text.indexOf('function __asyncjs__isaac_yield_js(work)'),text.indexOf('__asyncjs__isaac_yield_js.sig="id";'));
          assert.ok(yieldText(modules['boot.mjs']).length>0);
          const frameCostStart='var isaacYieldAt=performance.now();';
          const frameCostEnd='if(typeof window!=="undefined"&&window.isaacRecordFrame)window.isaacRecordFrame(work,isaacYieldAt,performance.now());';
          const patchedYield=yieldText(modules['boot.mjs']);
          assert.ok(patchedYield.includes('{var waited=1;'+frameCostStart),'Frame cost start is not at yield entry');
          assert.ok(patchedYield.includes('await Module.isaacPaceFrame();'+frameCostEnd+'return waited})}'),'Frame cost end is not after pacing');
          assert.equal(patchedYield.replace('if(Module.isaacPaceFrame)await Module.isaacPaceFrame();','').replace(frameCostStart,'').replace(frameCostEnd,''),yieldText(registry(source)['boot.mjs']));
          console.log('DEFAULT AND EXPLICIT OFF PACING CONFIGURATION VERIFIED; PINNED YIELD UNCHANGED APART FROM PACING AND FRAME COST');
          {
            // GL sync: after start-up, getError skips the GPU round trip unless ?glsync=on.
            const glPairs=[["var _emscripten_glGetError=()=>{var error=GLctx.getError()||GL.lastError;",'var _emscripten_glGetError=()=>{var error=(Module.isaacGlSync||!(typeof window!=="undefined"&&window.isaacFrame>600)?GLctx.getError():0)||GL.lastError;']];
            assert.ok(modules['boot.mjs'].includes('var _emscripten_glCheckFramebufferStatus=x0=>GLctx.checkFramebufferStatus(x0);'),'checkFramebufferStatus must stay as shipped: faking it leaves the game canvas black');
            const glSlice=(text,start)=>text.slice(text.indexOf(start),text.indexOf(';var ',text.indexOf(start)+start.length)+1);
            for(const [before,after] of glPairs) {
              assert.equal(modules['boot.mjs'].split(after).length,2,'GL sync patch missing or repeated: '+after);
              assert.equal(registry(source)['boot.mjs'].split(before).length,2,'Upstream GL glue changed: '+before);
              const name=before.slice(0,before.indexOf('='));
              assert.equal(glSlice(modules['boot.mjs'],name).replace(after,before),glSlice(registry(source)['boot.mjs'],name),'GL glue changed beyond the switch: '+name);
            }
            const gl=modules['boot_web.mjs'].match(/cfg\.isaacGlSync=params\.get\('glsync'\)==='on';window\.isaacGlSyncMode=cfg\.isaacGlSync\?'sync':'relaxed';/);
            assert.ok(gl,'GL sync switch not found');
            const glConfigure=new Function('params','cfg','window',gl[0]);
            for(const [query,mode,sync] of [['','relaxed',false],['glsync=on','sync',true],['glsync=off','relaxed',false],['glsync=1','relaxed',false]]) {
              const cfg={},window={};glConfigure(new URLSearchParams(query),cfg,window);
              assert.equal(window.isaacGlSyncMode,mode,query);assert.equal(cfg.isaacGlSync,sync,query);
            }
            console.log('GL SYNC SWITCH AND PINNED GLUE VERIFIED');
          }
          const readTrack='if(n&&typeof n.then==="function"&&typeof window!=="undefined"&&window.isaacTrackRead)n=window.isaacTrackRead(n);';
          const preadText=text=>text.slice(text.indexOf('function isaac_fs_lazy_pread_js('),text.indexOf('isaac_fs_lazy_pread_js.sig='));
          assert.equal(preadText(modules['boot.mjs']).replace(readTrack,''),preadText(registry(source)['boot.mjs']));
          const sleepText=text=>text.slice(text.indexOf('var _emscripten_sleep=function(ms){'),text.indexOf('_emscripten_sleep.isAsync=true;'));
          assert.equal(sleepText(modules['boot.mjs']).replace('let innerFunc=()=>{let slept=new Promise(resolve=>setTimeout(resolve,ms));return typeof window!=="undefined"&&window.isaacTrackSleep?window.isaacTrackSleep(slept):slept};','let innerFunc=()=>new Promise(resolve=>setTimeout(resolve,ms));'),sleepText(registry(source)['boot.mjs']));
          {
            // Run guard: a run saved with mods stays out of the game when any of those mods will not load.
            const bootWeb=modules['boot_web.mjs'];
            for(const piece of ["import{createRunGuard,isRunState,loadableMods,RETIRED_MODS,DEFAULT_OFF_MODS,defaultOffDue,markDefaultOff}from'./mobile_run_guard.mjs';","import{listMods,SEED_BUDGET,openModDb as openModDbForRuns,getMod as getModForRuns,deleteMod as deleteModForRuns,setModEnabled as setModEnabledForRuns}from'./mods.mjs';",'if(modDb)for(const id of RETIRED_MODS){try{if(await getModForRuns(modDb,id)){await deleteModForRuns(modDb,id);','mods:c.value.mods}','if(isRunState(key)){const d=runGuard.decide(mods);','persistPending.push({key,src,bytes,...runGuard.tag(key)});'])
              assert.equal(bootWeb.split(piece).length,2,'Run guard piece missing or repeated: '+piece);
            const check=bootWeb.indexOf('runGuard.useMods('),restore=bootWeb.indexOf("await stageOk('restore saves'"),seed=bootWeb.indexOf("await stageOk('seed mods'"),read=bootWeb.indexOf('const saved=await readSaves();');
            assert.ok(restore<check&&check<read&&read<seed,'Runs must be checked while saves are restored, before mods are seeded');
            const {createRunGuard,isRunState,loadableMods,LEGACY_RUN,RETIRED_MODS,DEFAULT_OFF_MODS,defaultOffDue,markDefaultOff}=await import('./mobile/run_guard.mjs');
            assert.deepEqual(DEFAULT_OFF_MODS,['stats-plus']);
            assert.ok(bootWeb.includes('const mod=await getModForRuns(db,id);if(!mod)continue;if(!markDefaultOff(id))continue;'),'Default-off must be recorded, for an installed mod, before switching');
            assert.ok(bootWeb.includes('if(db)await applyDefaultOff(db);runGuard.useMods('),'Default-off must run before the expected mod set is read');
            assert.ok(bootWeb.indexOf('if(modDb)await applyDefaultOff(modDb);')<bootWeb.indexOf('const r=await seedMods(modDb,seed,log,'),'Default-off fallback must run before mods are seeded');
            {
              const mem=new Map(),store={getItem:k=>mem.has(k)?mem.get(k):null,setItem:(k,v)=>mem.set(k,v)};
              assert.equal(defaultOffDue('stats-plus',store),true,'Owed on a fresh install');
              markDefaultOff('stats-plus',store);
              assert.equal(defaultOffDue('stats-plus',store),false,'Never forced twice, so a player can turn it back on');
              assert.equal(defaultOffDue('stats-plus',{getItem(){throw Error('blocked')}}),false,'Without storage nothing is forced');
              assert.equal(defaultOffDue('stats-plus',null),false);
              const readOnly={getItem:()=>null,setItem(){throw Error('quota')}};
              assert.equal(markDefaultOff('stats-plus',readOnly),false,'A switch that cannot be remembered is reported as not stored');
              assert.equal(markDefaultOff('stats-plus',{getItem:k=>'1',setItem(){}}),true);
            }
            assert.deepEqual(RETIRED_MODS,['drop-trinkets-faster']);
            assert.ok(bootWeb.indexOf('deleteModForRuns(modDb,id)')<bootWeb.indexOf('const r=await seedMods(modDb,seed,log,')&&bootWeb.indexOf('deleteModForRuns(modDb,id)')>bootWeb.indexOf("await stageOk('seed mods'"),'Retired mods must be removed in the seed stage, before seeding');
            for(const [key,run] of [['c:/isaac/documents/my games/binding of isaac repentance+/gamestate1.dat',true],['gamestate12.dat',true],['GameState3.DAT',true],['persistentgamedata1.dat',false],['c:/isaac/data/eid/save1.dat',false],['gamestate1.dat.bak',false]])
              assert.equal(isRunState(key),run,key);
            // Same rules as seedMods: enabled, has files, within the budget in list order.
            assert.deepEqual(loadableMods([{id:'drop-trinkets-faster',enabled:true,files:5,bytes:1},{id:'a',enabled:true,files:1,bytes:1}],100),['a'],'A retired mod is never expected to load');
            assert.deepEqual(loadableMods([{id:'b',enabled:true,files:2,bytes:40},{id:'off',enabled:false,files:1,bytes:1},{id:'empty',enabled:true,files:0,bytes:0},{id:'big',enabled:true,files:1,bytes:70},{id:'a',enabled:true,files:1,bytes:50}],100),['a','b']);
            const cases={
              'legacy run with mods expected is restored and stamped':{use:['a'],mods:undefined,want:{restore:true,stamp:true,missing:[]}},
              'legacy run with no mods expected is kept aside':{use:[],mods:undefined,want:{restore:false,stamp:false,missing:[LEGACY_RUN]}},
              'run recorded without mods is restored with none expected':{use:[],mods:[],want:{restore:true,stamp:false,missing:[]}},
              'recorded mods all expected':{use:['c','a','b'],mods:['a','b'],want:{restore:true,stamp:false,missing:[]}},
              'recorded mod turned off':{use:['a'],mods:['a','b'],want:{restore:false,stamp:false,missing:['b']}},
              'a default-off mod recorded with the run is not needed':{use:['a'],mods:['a','stats-plus'],want:{restore:true,stamp:false,missing:[]}},
              'a retired mod recorded with the run is not needed':{use:['a'],mods:['a','drop-trinkets-faster'],want:{restore:true,stamp:false,missing:[]}},
              'unreadable mod list restores as before':{use:null,mods:['a','b'],want:{restore:true,stamp:false,missing:[]}},
              'unreadable mod list does not stamp legacy runs':{use:null,mods:undefined,want:{restore:true,stamp:false,missing:[]}},
            };
            for(const [name,c] of Object.entries(cases)) {
              const guard=createRunGuard();guard.useMods(c.use);
              assert.deepEqual(guard.decide(c.mods),c.want,name);
            }
            const tagging=createRunGuard();
            assert.deepEqual(tagging.tag('gamestate2.dat'),{},'A run written before the check must stay unrecorded');
            tagging.useMods(['b','a','a']);
            assert.deepEqual(tagging.tag('gamestate2.dat'),{mods:['a','b']});
            assert.deepEqual(tagging.tag('persistentgamedata2.dat'),{});
            tagging.loaded().push('x');tagging.tag('gamestate2.dat').mods.push('y');
            assert.deepEqual(tagging.tag('gamestate2.dat'),{mods:['a','b']},'Callers must not change what later saves record');
            console.log('RUN GUARD DECISIONS AND BOOT ORDER VERIFIED');
          }
          {
            // Callback guard: main.lua calls mod callbacks through pcall, so a mod error is logged instead of ending the game.
            const bootWeb=modules['boot_web.mjs'];
            for(const piece of ["import{patchGameScript}from'./mobile_script_fixes.mjs';","patchGameScript(rel,await fetchBytes(`/instance/${rel}`),{enabled:params.get('callbackguard')!=='off'});","m.FS.writeFile('/'+rel,fixed.bytes);"])
              assert.equal(bootWeb.split(piece).length,2,'Callback guard piece missing or repeated: '+piece);
            const {patchGameScript,CALLBACK_GUARD_SCRIPT}=await import('./mobile/script_fixes.mjs');
            const enc=t=>new TextEncoder().encode(t),dec=b=>new TextDecoder().decode(b);
            const dispatch='function _RunCallback(callbackId, param, ...)\r\n\tlocal callbacks = Callbacks[callbackId]\r\n\t\t\t\tlocal result = v.Function(v.Mod, ...)\r\n';
            const guarded=patchGameScript(CALLBACK_GUARD_SCRIPT,enc('-- head\r\n'+dispatch));
            assert.equal(guarded.status,'guarded');
            const text=dec(guarded.bytes);
            assert.ok(text.includes('local ok, result = pcall(v.Function, v.Mod, ...) if not ok then _isaacWebReportCallbackError(callbackId, v.Mod, result) return nil end'),'Call not guarded, or a failed callback does not end the dispatch like the PC game');
            assert.ok(/from mod " \.\. tostring\(mod and mod\.Name\)/.test(text),'The log must name the mod');
            assert.ok(!text.includes('local result = v.Function(v.Mod, ...)'),'Unguarded call left behind');
            assert.ok(text.indexOf('local function _isaacWebReportCallbackError')<text.indexOf('function _RunCallback('),'Reporter must be defined before dispatch');
            assert.ok(/n <= 3 or n % 1000 == 0/.test(text),'Error log is not bounded');
