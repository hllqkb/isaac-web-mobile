      - name: Prepare cloud browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          mkdir -p output
      - name: Verify phone touch, desktop keyboard, cache and existing player data
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > output/server.log 2>&1 &
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const html=fs.readFileSync('game.html','utf8');
          const modules=JSON.parse(html.match(/window\.__isaacModules = (.*?);<\/script>/s)[1]);
          const order=JSON.parse(html.match(/var order = (\[.*?\]);/s)[1]);
          const touchStyleStart=html.indexOf('/* Touch play:');
          if(touchStyleStart<0)throw Error('Production touch styles missing');
          const touchStyles=html.slice(touchStyleStart,html.indexOf('</style>',touchStyleStart));
          const browser=await chromium.launch({headless:true});
          const errors=[];
          async function controls(context,coarse) {
            const page=await context.newPage();
            page.on('pageerror',error=>errors.push(error.message));
            await page.route('**/control-harness',route=>route.fulfill({contentType:'text/html',body:'<main></main>'}));
            await page.goto('http://127.0.0.1:8765/control-harness');
            await page.setContent(`<meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#201912}#stage{position:absolute;left:140px;top:20px;width:480px;height:270px}#canvas{display:block;width:100%;height:100%;background:#493b2c}${touchStyles}</style><main><div id="stage"><canvas id="canvas" width="480" height="270"></canvas></div></main>`);
            await page.evaluate(async({modules,order})=>{
              const urls={};
              for(const name of order) {
                const text=modules[name].replace(/(["'])\.\/([A-Za-z0-9_.-]+\.mjs)\1/g,(_m,_q,dep)=>JSON.stringify(urls[dep]||'./'+dep));
                urls[name]=URL.createObjectURL(new Blob([text],{type:'text/javascript'}));
              }
              const {createTouchControls}=await import(urls['touch_controls.mjs']);
              window.createButtonFixture=(await import(urls['mobile_buttons.mjs'])).createMobileButtons;
              window.controlTrace=[];
              window.controlState={ready:true,running:false,paused:false,blocked:false,menu:5,frame:0};
              window.controls=createTouchControls({readState:()=>({...controlState,frame:Math.floor(performance.now()/16)}),
                emit:(key,down)=>controlTrace.push({key,down}),guest:()=>null,onGesture:()=>{},
                assetsUrl:'/unused',readAsset:async()=>{throw Error('Art is not needed by the input harness');}});
              // Exercise the unchanged production keyboard handler without instantiating Wasm.
              const boot=modules['boot_web.mjs'];
              const from=boot.indexOf('const KEYS={'),to=boot.indexOf('let m;try{m=await Module(cfg)',from);
              if(from<0||to<0)throw Error('Keyboard handler boundary changed');
              const cfg={},m={HEAP32:new Int32Array(4)};
              new Function('cfg','params','log','m',boot.slice(from,to))(cfg,new URLSearchParams(),()=>{},m);
              window.readKeyboard=()=>{const events=[];while(cfg.isaacInputPoll(0,0))events.push(Array.from(m.HEAP32));return events;};
            },{modules,order});
            await page.waitForTimeout(200);
            const actual=await page.evaluate(()=>matchMedia('(pointer:coarse)').matches);
            if(actual!==coarse)throw Error('Browser pointer setup mismatch');
            if(coarse) {
              await page.evaluate(()=>{
                const stage=document.querySelector('#stage');
                Object.assign(stage.style,{left:'50%',top:'50%',transform:'translate(-50%,-50%)',width:'min(100vw, calc(100vh * 16 / 9))',height:'auto',aspectRatio:'16 / 9'});
                document.body.style.background='#000';
              });
              for(const [width,height] of [[850,390],[792,375],[700,390],[375,812]]) {
                await page.setViewportSize({width,height});
                await page.evaluate(()=>dispatchEvent(new Event('resize')));
                const layout=await page.evaluate(()=>{
                  const box=el=>{const r=el.getBoundingClientRect();return{x:r.x,y:r.y,width:r.width,height:r.height,right:r.right,bottom:r.bottom};};
                  return{stage:box(document.querySelector('#stage')),buttons:[...document.querySelectorAll('.mobile-tools > button')].map(box)};
                });
                if(layout.buttons.length!==4)throw Error('Expected four rail buttons');
                layout.buttons.forEach((button,index)=>{
                  if(button.width<44||button.height<44||button.x<0||button.y<0||button.bottom>height)
                    throw Error('Rail button is too small or clipped: '+JSON.stringify(layout));
                  if(index&&(Math.abs(button.x-layout.buttons[0].x)>.1||button.y<layout.buttons[index-1].bottom+5))
                    throw Error('Rail is not a single vertical column: '+JSON.stringify(layout));
                  const outsideGame=width>height ? button.right<=layout.stage.x-4 : button.bottom<=layout.stage.y-4;
                  if(!outsideGame)throw Error('Rail overlaps the game or HUD: '+JSON.stringify(layout));
                });
                console.log('BUTTON RAIL OUTSIDE GAME',JSON.stringify({width,height,...layout}));
                await page.screenshot({path:`output/phone-left-rail-${width}x${height}.png`});
              }
              await page.setViewportSize({width:850,height:390});
              await page.evaluate(()=>dispatchEvent(new Event('resize')));
              await page.locator('[data-mobile-action="menu-e"]').waitFor({state:'visible'});
              await page.locator('[data-mobile-action="menu-e"]').tap();
              await page.waitForFunction(()=>controlTrace.filter(e=>e.key==='e').length===2);
              console.log('PHONE E TOUCH',await page.evaluate(()=>controlTrace));
              await page.evaluate(async()=>{
                const fixture=document.createElement('div');document.body.append(fixture);
                const trace=[],current={ready:true,running:true,paused:false,blocked:false,menu:0,frame:1};
                let frame=1;
                const memory=new Map([[0xc71678,100],[0xc7169c,200],[100+0x264f8,1],[100+0x18300,300],
                  [100+0x1baa8,400],[100+0x1baac,404],[300+12,10],[300+16,10],[400,500],[500+0x28,1]]);
                const previousGuest=window.isaacGuest,previousInject=window.isaacInjectKey;
                window.isaacGuest={u32:address=>address===100+0x264f8?frame:(memory.get(address)||0),u8:()=>0};
                window.isaacInjectKey=(key,down)=>trace.push({key,down});
                const controls=createButtonFixture({root:fixture,state:()=>current,input:{tap:(_owner,key)=>trace.push({key,down:true}),reset(){}},
                  gesture(){},listen:(target,type,handler)=>target.addEventListener(type,handler)});
                controls.update('game');
                const buttons=[...fixture.querySelectorAll('.mobile-tools > button')];
                const [enter,swap,drop,tools]=buttons;
                const assert=(ok,message)=>{if(!ok)throw Error(message+' '+JSON.stringify(trace));};
                const send=(el,type,id=41,dx=0,dy=0,extra={})=>{
                  const box=el.getBoundingClientRect();
                  el.dispatchEvent(new PointerEvent(type,{bubbles:true,cancelable:true,pointerId:id,pointerType:'touch',
                    clientX:box.left+box.width/2+dx,clientY:box.top+box.height/2+dy,button:0,...extra}));
                };
                const tap=(el,id=41)=>{send(el,'pointerdown',id);send(el,'pointerup',id);};
                try {
                  for(const [el,key] of [[enter,'enter'],[swap,'ctrl']]) {
                    trace.length=0;send(el,'pointerdown');assert(!trace.length,'Down injected '+key);
                    send(el,'pointerup');assert(trace.length===1&&trace[0].key===key,'Up did not trigger once');
                    el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,detail:1}));assert(trace.length===1,'Pointer click duplicated');
                    trace.length=0;
                    for(const kind of ['move','outside-back','cancel','lost','leave','blur','hidden','disabled','state','menu-return']) {
                      send(el,'pointerdown');
                      if(kind==='move')send(el,'pointermove',41,12);
                      if(kind==='outside-back'){send(el,'pointermove',41,80);send(el,'pointermove');}
                      if(kind==='cancel')send(el,'pointercancel');
                      if(kind==='lost')send(el,'lostpointercapture');
                      if(kind==='leave')send(el,'pointerleave');
                      if(kind==='blur')dispatchEvent(new Event('blur'));
                      if(kind==='hidden'){Object.defineProperty(document,'hidden',{configurable:true,value:true});document.dispatchEvent(new Event('visibilitychange'));delete document.hidden;}
                      if(kind==='disabled'){el.disabled=true;await Promise.resolve();el.disabled=false;await Promise.resolve();}
                      if(kind==='state'){current.paused=true;controls.update('game');current.paused=false;controls.update('game');}
                      if(kind==='menu-return'){current.menu=5;controls.update('game');current.menu=0;controls.update('game');}
                      send(el,'pointerup');assert(!trace.length,'Cancelled tap executed '+kind);
                    }
                    send(el,'pointerdown');await new Promise(resolve=>setTimeout(resolve,700));send(el,'pointerup');assert(!trace.length,'Long hold executed');
                  }
                  trace.length=0;send(enter,'pointerdown',51);send(swap,'pointerdown',52);send(enter,'pointerup',51);send(swap,'pointerup',52);
                  assert(!trace.length,'Conflicting tool fingers executed');
                  // A non-primary tool pointer is valid while another finger owns a joystick.
                  send(enter,'pointerdown',61,0,0,{isPrimary:false});send(enter,'pointerup',61,0,0,{isPrimary:false});
                  assert(trace.length===1,'Joystick finger blocked a valid tool tap');
                  trace.length=0;enter.click();assert(trace.length===1,'Assistive click failed');
                  trace.length=0;send(drop,'pointerdown');assert(!trace.length,'Drop began on down');send(drop,'pointerup');
                  assert(trace.length===1&&trace[0].key==='ctrl'&&trace[0].down,'Drop tap did not start native hold');
                  frame+=95;controls.update('game');assert(trace.length===1,'Drop released before 96 native frames');
                  frame++;controls.update('game');assert(trace.length===2&&!trace[1].down,'Drop hold did not release at 96 native frames');
                  const initial=tools.getAttribute('aria-expanded');send(tools,'pointerdown');assert(tools.getAttribute('aria-expanded')===initial,'Tools opened on down');
                  send(tools,'pointerup');assert(tools.getAttribute('aria-expanded')==='true','Tools did not open on completed tap');
                  console.log('FOUR RAIL BUTTONS: TAP COMMIT, CANCELLATION, MULTITOUCH AND 96-FRAME DROP VERIFIED');
                } finally {fixture.remove();window.isaacGuest=previousGuest;window.isaacInjectKey=previousInject;}
              });

            } else {
              if(!await page.locator('#touch-controls').isHidden())throw Error('Desktop has a touch overlay');
              await page.locator('#canvas').focus();
              await page.keyboard.press('w');await page.keyboard.press('ArrowUp');
              const events=await page.evaluate(()=>readKeyboard());
              for(const vk of [0x57,0x26]) {
                if(!events.some(e=>e[1]===vk&&e[3]===1)||!events.some(e=>e[1]===vk&&e[3]===0))
                  throw Error('Desktop keyboard event was blocked: '+JSON.stringify(events));
              }
              console.log('DESKTOP KEYBOARD',events);
            }
            await page.screenshot({path:'output/'+(coarse?'phone-controls':'desktop-controls')+'.png'});
            await page.close();
          }
          try {
            const phone=await browser.newContext({viewport:{width:850,height:390},hasTouch:true,isMobile:true});
            await controls(phone,true);await phone.close();
            const desktop=await browser.newContext({viewport:{width:1366,height:768},hasTouch:false});
            await controls(desktop,false);await desktop.close();
            const context=await browser.newContext();
            await context.route('**/game.html',route=>route.fulfill({contentType:'text/html',body:'<p>Game navigation reached</p>'}));
            const page=await context.newPage();
            page.on('pageerror',error=>errors.push(error.message));
            await page.goto('http://127.0.0.1:8765/');
            await page.locator('#start').waitFor({state:'visible'});
            await page.waitForFunction(()=>!document.querySelector('#start').disabled);
            for (const [name, viewport] of [['desktop',{width:1366,height:900}],['phone-portrait',{width:390,height:844}],['phone-landscape',{width:850,height:390}]]) {
              await page.setViewportSize(viewport);
              await page.evaluate(async()=>{await document.fonts.ready;await Promise.all([...document.images].map(image=>image.decode()));});
              await page.waitForFunction(()=>[...document.querySelectorAll('.scene,.sheet')].every(element=>getComputedStyle(element).opacity==='1'));
              if(await page.locator('#start').innerText()!=='开始游戏')throw Error('Landing CTA label changed');
              const bounds=await page.locator('#start').boundingBox();
              if(!bounds||bounds.x<0||bounds.y<0||bounds.x+bounds.width>viewport.width||bounds.y+bounds.height>viewport.height)
                throw Error('Start button is outside the first viewport: '+JSON.stringify({name,bounds}));
              if(await page.evaluate(()=>document.documentElement.scrollWidth>innerWidth))throw Error('Landing page horizontal overflow: '+name);
              await page.screenshot({path:'output/landing-'+name+'.png',fullPage:true,animations:'disabled'});
            }
            await page.setViewportSize({width:1366,height:900});
            await page.locator('#start').click();await page.frameLocator('#game-frame').getByText('Game navigation reached').waitFor({timeout:120000});
            await page.waitForFunction(()=>document.fullscreenElement===document.documentElement&&document.activeElement===document.querySelector('#game-frame'));
            if(!page.url().endsWith('/'))throw Error('Game navigated away from its fullscreen parent');
            const counts=await page.evaluate(async()=>{
              async function rows(name,store){const db=await new Promise((r,j)=>{const q=indexedDB.open(name);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});try{return await new Promise((r,j)=>{const q=db.transaction(store).objectStore(store).getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}finally{db.close()}}
              const mods=await rows('isaac-mods','mods'),files=await rows('isaac-mods','files'),saves=await rows('isaac-saves','files');
              return{mods:mods.length,enabled:mods.filter(m=>m.enabled!==false).length,files:files.length,saves:saves.length,binary:files.every(f=>f.bytes instanceof Uint8Array)};
            });
            if(counts.mods!==41||counts.enabled!==35||counts.files!==1388||counts.saves!==33||!counts.binary)throw Error('Shared preset mismatch: '+JSON.stringify(counts));
            console.log('INITIAL PRESET IMPORT',counts);
            await page.evaluate(async()=>{
              const db=await new Promise(r=>{const q=indexedDB.open('isaac-saves');q.onsuccess=()=>r(q.result)});
              await new Promise((r,j)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put({src:'',bytes:new Uint8Array([5,11,26])},'existing-player-progress');tx.oncomplete=r;tx.onerror=()=>j(tx.error)});db.close();
              localStorage.removeItem('isaac-shared-ready');
            });
            let presetRequests=0;
            page.on('request',request=>{if(/preset-\d+\.bin/.test(request.url()))presetRequests++;});
            await page.goto('http://127.0.0.1:8765/');
            await page.waitForFunction(()=>!document.querySelector('#start').disabled);
            if(await page.locator('#start').innerText()!=='开始游戏')throw Error('Existing-save CTA label changed');
            await page.locator('#start').click();await page.frameLocator('#game-frame').getByText('Game navigation reached').waitFor();
            const retained=await page.evaluate(async()=>{
              const db=await new Promise(r=>{const q=indexedDB.open('isaac-saves');q.onsuccess=()=>r(q.result)});
              try{return await new Promise(r=>{const q=db.transaction('files').objectStore('files').get('existing-player-progress');q.onsuccess=()=>r(Array.from(q.result.bytes))})}finally{db.close()}
            });
            if(JSON.stringify(retained)!=='[5,11,26]'||presetRequests)throw Error('Existing player data was re-imported');
            console.log('EXISTING PLAYER DATA PRESERVED',retained);
            await page.evaluate(async()=>{if(document.fullscreenElement)await document.exitFullscreen();});
            await page.addInitScript(()=>{
              window.isaacHosted=true;window.__fsCalls=0;window.__fakeFullscreen=false;
