name: Verify shared Isaac web updates
on:
  push:
    branches: ['site/mobile-*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply shared patches without downloading game assets
        id: patch
        run: python3 scripts/patch_game.py
      - name: Verify module syntax, source identity and refresh-independent timing
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {spawnSync} from 'node:child_process';
          import {createFramePacer} from './mobile/frame_clock.mjs';
          const page=fs.readFileSync('game.html','utf8'),source=fs.readFileSync('upstream/game.html','utf8');
          const registry=text=>JSON.parse(text.match(/window\.__isaacModules = (.*?);<\/script>/s)[1]);
          const modules=registry(page);
          const manifest=text=>text.match(/window\.__isaacPortableData = (.*?);<\/script>/s)[1];
          if(manifest(page)!==manifest(source))throw Error('Pinned game resource manifest changed');
          if(!page.includes('isaac-shared-ready'))throw Error('First-run import gate disappeared');
          for(const [name,text] of Object.entries(modules)) {
            const checked=spawnSync(process.execPath,['--check','--input-type=module'],{input:text,encoding:'utf8'});
            if(checked.status!==0)throw Error(name+': '+checked.stderr);
          }
          for(const name of ['performance','console','buttons','frame_clock','boot_cache','save_guard','recovery'])
            if(modules['mobile_'+name+'.mjs']!==fs.readFileSync('mobile/'+name+'.mjs','utf8'))throw Error('Stale mobile module '+name);
          for(const refresh of [60,90,120,144]) {
            let time=0;
            const pace=createFramePacer({now:()=>time,wait:async ms=>{time+=ms;},hidden:()=>false});
            for(let n=0;n<300;n++){time+=1000/refresh;await pace();}
            const updates=150/(time/1000);
            if(updates<29.5||updates>30.2)throw Error('Refresh-dependent engine speed: '+JSON.stringify({refresh,updates}));
            console.log('ENGINE TIMING',JSON.stringify({refresh,updates}));
          }
          console.log('PINNED RESOURCE AND MODULE CHECKS PASSED');
          JS
      - name: Verify transport failures, slow streams and immutable fallback
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {createResourceTransport} from './web/resource_transport.mjs';
          const page=fs.readFileSync('game.html','utf8');
          const start=page.indexOf('  async function body('),end=page.indexOf('  function decode(',start);
          const readBody=new Function('downloads','record',page.slice(start,end)+';return body;')([[{}]],()=>{});
          const primary='https://cdn.jsdelivr.net/gh/chiikabu/boi-portable@a78b90506b8a25436be6469904e6a59c2e186f82/r14b/b0.bin?v=bfa2c52b';
          const mirror='https://raw.githubusercontent.com/chiikabu/boi-portable/a78b90506b8a25436be6469904e6a59c2e186f82/r14b/b0.bin?v=bfa2c52b';
          const good=()=>new Response(new Uint8Array([1,2,3,4]),{headers:{'content-length':'4'}});
          const check=r=>r.status===200&&!r.headers.get('content-range')&&(!r.headers.has('content-length')||r.headers.get('content-length')==='4');
          const run=async(fetch,limits={})=>{
            const urls=[],transport=createResourceTransport({headerMs:60,idleMs:60,...limits,fetch:async(url,init)=>{urls.push(url);return fetch(url,init,urls.length);}});
            const bytes=await transport.readWhole({key:'0:0',url:primary,check,read:(r,progress)=>readBody(r,0,0,0,4,progress)});
            return {bytes,urls,stats:transport.summary()};
          };
          for(const kind of ['headers','body','arraybuffer','short','invalid']) {
            const result=await run(async(url,{signal},attempt)=>{
              if(attempt===2)return good();
              if(kind==='headers')return new Promise((_,reject)=>signal.addEventListener('abort',()=>reject(Error('aborted')),{once:true}));
              if(kind==='body')return new Response(new ReadableStream({start(c){signal.addEventListener('abort',()=>c.error(Error('aborted')),{once:true});}}));
              if(kind==='arraybuffer')return {status:200,headers:new Headers(),arrayBuffer:()=>new Promise(()=>{})};
              if(kind==='short')return new Response(new Uint8Array([1,2]));
              return new Response('wrong',{status:503});
            });
            assert.deepEqual([...result.bytes],[1,2,3,4]);assert.deepEqual(result.urls,[primary,mirror]);
            assert.equal(result.stats.fallbacks,1);assert.equal(result.stats.active.length,0);
            console.log('TRANSPORT RECOVERY',kind,JSON.stringify(result.stats));
          }
          const slow=await run(async()=>new Response(new ReadableStream({async start(c){for(let i=1;i<=4;i++){await new Promise(r=>setTimeout(r,35));c.enqueue(new Uint8Array([i]));}c.close();}})),{idleMs:90});
          assert.equal(slow.stats.timeouts,0);assert.equal(slow.urls.length,1);
          console.log('SLOW STREAM EXCEEDS DEADLINE BUT RETAINS PROGRESS',slow.stats);
          const notices=[],transport=createResourceTransport({fetch:async()=>new Response('unavailable',{status:503}),notify:text=>notices.push(text)});
          await assert.rejects(transport.wait(transport.readWhole({key:'0:0',url:primary,check,read:()=>{throw Error('invalid response read');}}),'0:0'),/已尝试 2 个固定版本源/);
          assert.equal(transport.summary().waiting,0);assert.ok(notices.at(-1).includes('读取失败'));
          assert.ok(!fs.readFileSync('web/resource_transport.mjs','utf8').includes('location.reload'));
          console.log('FINAL FAILURE REPORTED WITHOUT RELOAD');
          const hints=[],visible=createResourceTransport({fetch:async()=>good(),notify:text=>hints.push(text)});
          const waiting=visible.wait(new Promise(resolve=>setTimeout(()=>resolve(4),850)),'0:0');
          assert.equal(await waiting,4);assert.ok(hints.some(text=>text.includes('正在读取游戏资源')));assert.equal(hints.at(-1),'');
          console.log('DEMAND WAIT NOTICE APPEARS AND CLEARS');
          JS
      - name: Reproduce hidden reader waits and verify pending read diagnostics
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import vm from 'node:vm';
          const page=fs.readFileSync('game.html','utf8');
          const modules=JSON.parse(page.match(/window\.__isaacModules = (.*?);<\/script>/s)[1]);
          const boot=modules['boot_web.mjs'];
          const worker=boot.match(/const READER_WORKER=(`[^`]*`);/s);
          assert.ok(worker,'Pinned reader worker source not found');
          const source=new Function('return '+worker[1])();
          const shortened=source.replace('createReaderFetch({fetch:fetch.bind(globalThis)})',
            'createReaderFetch({fetch:fetch.bind(globalThis),headerMs:30,idleMs:70})');
          assert.notEqual(shortened,source,'Worker must use the guarded fetch');
          const run=async(fetch,url='https://example.invalid/chunk.bin#r=0-3!4',len=4)=>{
            let timer,attempts=0;
            const messages=[];
            const result=new Promise((resolve,reject)=>{
              timer=setTimeout(()=>reject(Error('Reader failed to settle')),3000);
              const context=vm.createContext({Response,ReadableStream,Uint8Array,ArrayBuffer,DecompressionStream,
                AbortController,performance,setTimeout,clearTimeout,onmessage:null,
                postMessage:message=>{messages.push(message);if(message.want===1)resolve(message);},
                fetch:(...args)=>fetch(...args,++attempts)});
              vm.runInContext(shortened,context);
              context.onmessage({data:{want:1,key:'fixture',url,len}});
            });
            try{return {message:await result,messages,attempts:()=>attempts};}finally{clearTimeout(timer);}
          };
          const good=()=>new Response(new Uint8Array([1,2,3,4]),{status:206,headers:{'content-range':'bytes 0-3/4'}});
          for(const phase of ['headers','body','arraybuffer']) {
            const hanging=()=>phase==='headers'?new Promise(()=>{}):phase==='body'?
              new Response(new ReadableStream({start(){}}),{status:206,headers:{'content-range':'bytes 0-3/4'}}):
              {ok:true,status:206,headers:new Headers({'content-range':'bytes 0-3/4'}),arrayBuffer:()=>new Promise(()=>{})};
            const recovered=await run((url,init,attempt)=>attempt===1?hanging():good());
            assert.deepEqual([...new Uint8Array(recovered.message.buf)],[1,2,3,4]);
            assert.equal(recovered.attempts(),2);
            const failed=await run(hanging);
            assert.equal(failed.message.buf,null);assert.equal(failed.attempts(),4);
            assert.match(failed.message.error,/reader (headers|body) timeout/);
            assert.equal(failed.messages.filter(message=>message.download).length,0);
            console.log('ACTUAL READER WORKER RECOVERS OR FAILS WITHIN BOUNDS',phase);
          }
          const slow=await run(()=>new Response(new ReadableStream({async start(c){
            for(let i=1;i<=4;i++){await new Promise(resolve=>setTimeout(resolve,35));c.enqueue(new Uint8Array([i]));}c.close();
          }}),{status:206,headers:{'content-range':'bytes 0-3/4'}}));
          assert.deepEqual([...new Uint8Array(slow.message.buf)],[1,2,3,4]);assert.equal(slow.attempts(),1);
          for(const kind of ['wrong-range','short-body']) {
            const recovered=await run((url,init,attempt)=>attempt===1?
              new Response(new Uint8Array(kind==='short-body'?[1,2]:[1,2,3,4]),
                {status:206,headers:{'content-range':kind==='wrong-range'?'bytes 1-4/4':'bytes 0-3/4'}}):good());
            assert.equal(recovered.attempts(),2);assert.deepEqual([...new Uint8Array(recovered.message.buf)],[1,2,3,4]);
          }
          const whole=await run(()=>new Response(new Uint8Array([1,2,3,4])),
            'https://example.invalid/chunk.bin#r=1-2!4',2);
          assert.deepEqual([...new Uint8Array(whole.message.buf)],[2,3]);
          assert.equal(whole.attempts(),1);
          console.log('SLOW PROGRESS, RANGE VALIDATION AND HTTP 200 FALLBACK PRESERVED');
          const start=boot.indexOf('window.isaacPendingReadStats='),end=boot.indexOf(';window.isaacLazyStats=',start);
          assert.ok(start>=0&&end>start,'Reader diagnostic hook not found');
          const pendingReads=new Map(Array.from({length:20},(_,i)=>[i,{src:'resources/packed/gfx.a',off:i*1024,len:1024,t0:1000+i}]));
          const window={};
          new Function('window','pendingReads','performance',boot.slice(start,end+1))(window,pendingReads,{now:()=>5000});
          const report=window.isaacPendingReadStats();
          assert.equal(report.pendingReads,20);assert.equal(report.oldestPendingMs,4000);assert.equal(report.windows.length,8);
          pendingReads.clear();assert.equal(window.isaacPendingReadStats().oldestPendingMs,0);
          console.log('PENDING READER COUNT, OLDEST AGE AND BOUNDED WINDOW METADATA VERIFIED');
          JS
      - name: Prepare cloud browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          mkdir -p output
      - name: Verify phone touch, desktop keyboard, cache and existing player data
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > output/server.log 2>&1 &
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import {chromium} from 'playwright';
          const html=fs.readFileSync('game.html','utf8');
          const modules=JSON.parse(html.match(/window\.__isaacModules = (.*?);<\/script>/s)[1]);
          const order=JSON.parse(html.match(/var order = (\[.*?\]);/s)[1]);
          const browser=await chromium.launch({headless:true});
          const errors=[];
          async function controls(context,coarse) {
            const page=await context.newPage();
            page.on('pageerror',error=>errors.push(error.message));
            await page.route('**/control-harness',route=>route.fulfill({contentType:'text/html',body:'<main></main>'}));
            await page.goto('http://127.0.0.1:8765/control-harness');
            await page.setContent('<meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#201912}#stage{position:absolute;left:140px;top:20px;width:480px;height:270px}canvas{width:100%;height:100%;background:#493b2c}</style><main><div id="stage"><canvas id="canvas" width="480" height="270"></canvas></div></main>');
            await page.evaluate(async({modules,order})=>{
              const urls={};
              for(const name of order) {
                const text=modules[name].replace(/(["'])\.\/([A-Za-z0-9_.-]+\.mjs)\1/g,(_m,_q,dep)=>JSON.stringify(urls[dep]||'./'+dep));
                urls[name]=URL.createObjectURL(new Blob([text],{type:'text/javascript'}));
              }
              const {createTouchControls}=await import(urls['touch_controls.mjs']);
              window.controlTrace=[];
              window.controlState={ready:true,running:false,paused:false,blocked:false,menu:5,frame:0};
              window.controls=createTouchControls({readState:()=>({...controlState,frame:Math.floor(performance.now()/16)}),
                emit:(key,down)=>controlTrace.push({key,down}),guest:()=>null,onGesture:()=>{},
                assetsUrl:'/unused',readAsset:async()=>{throw Error('Art is not needed by the input harness');}});
              // Exercise the unchanged production keyboard handler without instantiating Wasm.
              const boot=modules['boot_web.mjs'];
              const from=boot.indexOf('const KEYS={'),to=boot.indexOf('let m;try{m=await Module(cfg)',from);
              if(from<0||to<0)throw Error('Keyboard handler boundary changed');
              const cfg={},m={HEAP32:new Int32Array(4)};
              new Function('cfg','params','log','m',boot.slice(from,to))(cfg,new URLSearchParams(),()=>{},m);
              window.readKeyboard=()=>{const events=[];while(cfg.isaacInputPoll(0,0))events.push(Array.from(m.HEAP32));return events;};
            },{modules,order});
            await page.waitForTimeout(200);
            const actual=await page.evaluate(()=>matchMedia('(pointer:coarse)').matches);
            if(actual!==coarse)throw Error('Browser pointer setup mismatch');
            if(coarse) {
              await page.locator('[data-mobile-action="menu-e"]').waitFor({state:'visible'});
              await page.locator('[data-mobile-action="menu-e"]').tap();
              await page.waitForFunction(()=>controlTrace.filter(e=>e.key==='e').length===2);
              console.log('PHONE E TOUCH',await page.evaluate(()=>controlTrace));
            } else {
              if(!await page.locator('#touch-controls').isHidden())throw Error('Desktop has a touch overlay');
              await page.locator('#canvas').focus();
              await page.keyboard.press('w');await page.keyboard.press('ArrowUp');
              const events=await page.evaluate(()=>readKeyboard());
              for(const vk of [0x57,0x26]) {
                if(!events.some(e=>e[1]===vk&&e[3]===1)||!events.some(e=>e[1]===vk&&e[3]===0))
                  throw Error('Desktop keyboard event was blocked: '+JSON.stringify(events));
              }
              console.log('DESKTOP KEYBOARD',events);
            }
            await page.screenshot({path:'output/'+(coarse?'phone-controls':'desktop-controls')+'.png'});
            await page.close();
          }
          try {
            const phone=await browser.newContext({viewport:{width:850,height:390},hasTouch:true,isMobile:true});
            await controls(phone,true);await phone.close();
            const desktop=await browser.newContext({viewport:{width:1366,height:768},hasTouch:false});
            await controls(desktop,false);await desktop.close();
            const context=await browser.newContext();
            await context.route('**/game.html',route=>route.fulfill({contentType:'text/html',body:'<p>Game navigation reached</p>'}));
            const page=await context.newPage();
            page.on('pageerror',error=>errors.push(error.message));
            await page.goto('http://127.0.0.1:8765/');
            await page.locator('#start').waitFor({state:'visible'});
            await page.waitForFunction(()=>!document.querySelector('#start').disabled);
            await page.locator('#start').click();await page.waitForURL('**/game.html',{timeout:120000});
            const counts=await page.evaluate(async()=>{
              async function rows(name,store){const db=await new Promise((r,j)=>{const q=indexedDB.open(name);q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});try{return await new Promise((r,j)=>{const q=db.transaction(store).objectStore(store).getAll();q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)})}finally{db.close()}}
              const mods=await rows('isaac-mods','mods'),files=await rows('isaac-mods','files'),saves=await rows('isaac-saves','files');
              return{mods:mods.length,enabled:mods.filter(m=>m.enabled!==false).length,files:files.length,saves:saves.length,binary:files.every(f=>f.bytes instanceof Uint8Array)};
            });
            if(counts.mods!==41||counts.enabled!==35||counts.files!==1388||counts.saves!==33||!counts.binary)throw Error('Shared preset mismatch: '+JSON.stringify(counts));
            console.log('INITIAL PRESET IMPORT',counts);
            await page.evaluate(async()=>{
              const db=await new Promise(r=>{const q=indexedDB.open('isaac-saves');q.onsuccess=()=>r(q.result)});
              await new Promise((r,j)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put({src:'',bytes:new Uint8Array([5,11,26])},'existing-player-progress');tx.oncomplete=r;tx.onerror=()=>j(tx.error)});db.close();
              localStorage.removeItem('isaac-shared-ready');
            });
            let presetRequests=0;
            page.on('request',request=>{if(/preset-\d+\.bin/.test(request.url()))presetRequests++;});
            await page.goto('http://127.0.0.1:8765/');
            await page.waitForFunction(()=>!document.querySelector('#start').disabled);
            await page.locator('#start').click();await page.waitForURL('**/game.html');
            const retained=await page.evaluate(async()=>{
              const db=await new Promise(r=>{const q=indexedDB.open('isaac-saves');q.onsuccess=()=>r(q.result)});
              try{return await new Promise(r=>{const q=db.transaction('files').objectStore('files').get('existing-player-progress');q.onsuccess=()=>r(Array.from(q.result.bytes))})}finally{db.close()}
            });
            if(JSON.stringify(retained)!=='[5,11,26]'||presetRequests)throw Error('Existing player data was re-imported');
            console.log('EXISTING PLAYER DATA PRESERVED',retained);
            const cache=await page.evaluate(async()=>{
              const {createSoundBootCache}=await import('/mobile/boot_cache.mjs');
              let calls=0;const expected=new Uint8Array(64).map((_,n)=>n);
              const load=async()=>{calls++;return expected.slice()};
              const read=createSoundBootCache('ci-sound',64);
              const first=await read(load),stored=window.isaacBootCacheStats();
              const second=await read(load),hit=window.isaacBootCacheStats();
              const cache=await caches.open('isaac-decoded-sound-v1'),key=(await cache.keys())[0];
              await cache.put(key,new Response(new Uint8Array([1])));
              const third=await read(load),repaired=window.isaacBootCacheStats();
              return{calls,stored,hit,repaired,same:[first,second,third].every(b=>b.every((n,i)=>n===expected[i]))};
            });
            if(cache.calls!==2||!cache.same||cache.hit.sfx!=='hit'||cache.repaired.sfx!=='stored')throw Error('Decoded sound cache failed: '+JSON.stringify(cache));
            console.log('SOUND CACHE AND CORRUPT RECORD RECOVERY',cache);
            const saved=await page.evaluate(async()=>{
              const {createSaveWriter}=await import('/mobile/save_guard.mjs');
              const db=await new Promise((resolve,reject)=>{const q=indexedDB.open('ci-save-guard',1);q.onupgradeneeded=()=>q.result.createObjectStore('files');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});
              const queue=[{key:'slot',src:'',bytes:new Uint8Array([1])},{key:'other',src:'',bytes:new Uint8Array([3])}];
              let abort=true;
              const writer=createSaveWriter({store:'files',queue,database:()=>({transaction:(...args)=>{
                const tx=db.transaction(...args);
                if(abort){abort=false;queueMicrotask(()=>{queue.push({key:'slot',src:'',bytes:new Uint8Array([2])});tx.abort()});}
                return tx;
              }})});
              let failed=false;try{await writer.flush();}catch{failed=true;}
              const retained=writer.stats();
              const count=await new Promise(resolve=>{const q=db.transaction('files').objectStore('files').count();q.onsuccess=()=>resolve(q.result)});
              await writer.flush();
              const value=await new Promise(resolve=>{const q=db.transaction('files').objectStore('files').get('slot');q.onsuccess=()=>resolve(Array.from(q.result.bytes))});
              const complete=writer.stats();db.close();
              return{failed,retained,count,value,complete};
            });
            if(!saved.failed||saved.count!==0||saved.retained.pending!==2||saved.value[0]!==2||saved.complete.pending!==0)
              throw Error('Aborted save did not retain the newest write: '+JSON.stringify(saved));
            console.log('ABORTED SAVE RETAINED AND RETRIED',saved);
            await context.close();
            if(errors.length)throw Error('Browser errors: '+errors.join('\n'));
          } finally {
            fs.writeFileSync('output/browser.log',errors.join('\n'));
            await browser.close();
          }
          JS
      - name: Verify desktop and phone diagnostic reports without touching saves
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            for(const mobile of [false,true]) {
              const context=await browser.newContext({viewport:mobile?{width:850,height:390}:{width:1366,height:768},hasTouch:mobile,isMobile:mobile,acceptDownloads:true});
              const page=await context.newPage(),errors=[];
              page.on('pageerror',error=>errors.push(error.message));
              await page.route('**/diagnostics-harness',route=>route.fulfill({contentType:'text/html',body:`<meta name="viewport" content="width=device-width,initial-scale=1"><body><main><canvas tabindex="0"></canvas></main><script>
                window.isaacFrame=20;window.keyboardTrace=[];
                window.isaacResourceStats=()=>({attempts:2,fallbacks:1,failures:0,timeouts:1,waiting:1,active:[{key:'1:31',received:1024,fallback:true}]});
                window.isaacSaveStats=()=>({pending:2,inFlight:1,lastError:'fixture: save transaction aborted'});
                addEventListener('keydown',e=>keyboardTrace.push('down:'+e.key));addEventListener('keyup',e=>keyboardTrace.push('up:'+e.key));
                </script><script type="module" src="/web/diagnostics.mjs"></script>`}));
              await page.goto('http://127.0.0.1:8765/diagnostics-harness');
              await page.waitForFunction(()=>typeof window.isaacDiagnosticReport==='function');
              const button=page.locator('#isaac-diagnostic-toggle');
              assert.ok(await page.evaluate(()=>document.querySelector('main').contains(document.querySelector('#isaac-diagnostics'))),'Diagnostic controls disappear outside the game fullscreen target');
              const box=await button.boundingBox();assert.ok(box.width>=44&&box.height>=44);
              assert.equal(await page.evaluate(()=>isaacDiagnosticReport().previous),null);
              await page.locator('canvas').focus();await page.keyboard.down('w');
              if(mobile)await button.tap();else await button.click();
              await page.keyboard.up('w');
              const panel=page.locator('#isaac-diagnostic-panel');assert.ok(await panel.isVisible());
              assert.ok((await panel.innerText()).includes('游戏正在等待资源读取'));
              assert.ok((await panel.innerText()).includes('2 个待写'));
              assert.ok((await panel.innerText()).includes('save transaction aborted'));
              await page.evaluate(()=>{
                window.isaacPendingReadStats=()=>({pendingReads:1,oldestPendingMs:12500,windows:[{file:'resources/packed/gfx.a',offset:1048576,bytes:1024,ageMs:12500}]});
                isaacDiagnosticReport();
              });
              assert.ok((await panel.innerText()).includes('游戏正在等待读取文件或解码'));
              assert.ok((await panel.innerText()).includes('12.5 秒'));
              assert.ok(await page.evaluate(()=>keyboardTrace.includes('up:w')),'Opening diagnostics swallowed a held movement key release');
              await page.keyboard.press('Enter');
              assert.ok(!await page.evaluate(()=>keyboardTrace.includes('down:Enter')),'Diagnostics confirmed an in-game action');
              if(await panel.isHidden())await button.click();
              await page.evaluate(()=>dispatchEvent(new ErrorEvent('error',{message:'diagnostic fixture <img src=x onerror=alert(1)>'})));
              assert.ok((await panel.innerText()).includes('diagnostic fixture <img'));
              const downloadPromise=page.waitForEvent('download');await page.locator('[data-download]').click();
              const download=await downloadPromise,report=JSON.parse(fs.readFileSync(await download.path(),'utf8'));
              assert.equal(report.format,'isaac-web-diagnostics/1');assert.equal(report.current.save.pending,2);
              assert.equal(report.current.resources.waiting,1);assert.ok(report.errors.at(-1).text.includes('<img'));
              const saved=await page.evaluate(()=>JSON.parse(localStorage.getItem('isaac-web-diagnostics-v1')));
              assert.ok(saved.errors.at(-1).text.includes('diagnostic fixture'));
              await page.reload();await page.waitForFunction(()=>typeof window.isaacDiagnosticReport==='function');
              assert.ok(await page.evaluate(()=>isaacDiagnosticReport().previous.errors.at(-1).text.includes('diagnostic fixture')));
              await button.click();assert.ok(await page.locator('[data-previous]').isEnabled());
              await page.evaluate(()=>{window.isaacDone='fixture: engine ended';isaacDiagnosticReport();});
              assert.ok((await panel.innerText()).includes('引擎已结束或报错'));
              await page.evaluate(()=>{window.isaacDone=null;window.isaacPendingReadStats=()=>({pendingReads:0,oldestPendingMs:0,windows:[]});window.isaacResourceStats=()=>({attempts:0,fallbacks:0,failures:0,timeouts:0,waiting:0,active:[]});});
              await page.waitForTimeout(5500);
              await page.evaluate(()=>isaacDiagnosticReport());
              assert.ok((await panel.innerText()).includes('超过 5 秒未推进'));
              assert.deepEqual(await page.evaluate(()=>indexedDB.databases()),[]);
              await page.screenshot({path:'output/'+(mobile?'phone':'desktop')+'-diagnostics.png'});
              assert.deepEqual(errors,[]);
              console.log('DIAGNOSTIC UI, INPUT ISOLATION, EXPORT, PREVIOUS SNAPSHOT AND STALL SIGNAL PASSED',mobile?'phone':'desktop');
              await context.close();
            }
          } finally {await browser.close();}
          JS
      - name: Verify committed page matches the generated page
        run: git diff --exit-code -- game.html
      - uses: actions/upload-artifact@v4
        if: always() && steps.patch.outcome == 'success'
        with:
          name: Patched-web-game
          path: game.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Web-verification
          path: output/
  hosted:
    if: startsWith(github.ref_name, 'site/mobile-custom-host-')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Package and verify the complete same-origin site in cloud CI
        run: |
          python3 scripts/prepare_hosted.py
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          original=Path('game.html').read_text()
          hosted=Path('dist/game.html').read_text()
          pattern=r'window\.__isaacPortableData = (.*?);</script>'
          old=json.loads(re.search(pattern,original,re.S)[1])
          new=json.loads(re.search(pattern,hosted,re.S)[1])
          for before,after in zip(old['streams'],new['streams'],strict=True):
              assert after.get('base',new['base'])==f"./chunks/{before['tag']}"
              if 'base' in before: after['base']=before['base']
              else: after.pop('base',None)
          new['base']=old['base']
          assert new==old,'Game resource identities or metadata changed'
          module_pattern=r'window\.__isaacModules = (.*?);</script>'
          assert re.search(module_pattern,hosted,re.S)[1]==re.search(module_pattern,original,re.S)[1],'Game modules changed'
          assert 'window.isaacModCatalogue = null;' in hosted
          assert './web/diagnostics.mjs' in hosted
          assert len(list(Path('dist/chunks').rglob('*.bin')))==38
          for i in range(7): assert Path(f'dist/preset-{i}.bin').read_bytes()==Path(f'preset-{i}.bin').read_bytes()
          print('SAME-ORIGIN RESOURCE BUNDLE VERIFIED; ENGINE, CLOCK, MOD PRESET AND DIAGNOSTICS PRESERVED')
          PY
