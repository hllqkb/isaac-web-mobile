          from http.server import SimpleHTTPRequestHandler,ThreadingHTTPServer
          from pathlib import Path
          from typing import Any,BinaryIO
          class RangeHandler(SimpleHTTPRequestHandler):
              def __init__(self,*args:Any,**kwargs:Any)->None:
                  super().__init__(*args,directory='dist',**kwargs)
              def send_head(self)->BinaryIO|None:
                  value=self.headers.get('Range','')
                  path=Path(self.translate_path(self.path))
                  if value.startswith('bytes=') and path.is_file():
                      start,end=map(int,value[6:].split('-'))
                      size=path.stat().st_size
                      if 0<=start<=end<size:
                          source=path.open('rb');source.seek(start)
                          self.remaining=end-start+1
                          self.send_response(206)
                          self.send_header('Content-Type',self.guess_type(str(path)))
                          self.send_header('Content-Length',str(self.remaining))
                          self.send_header('Content-Range',f'bytes {start}-{end}/{size}')
                          self.end_headers();return source
                  return super().send_head()
              def copyfile(self,source:BinaryIO,output:BinaryIO)->None:
                  if not hasattr(self,'remaining'):return super().copyfile(source,output)
                  while self.remaining:
                      data=source.read(min(65536,self.remaining))
                      if not data:break
                      output.write(data);self.remaining-=len(data)
          ThreadingHTTPServer(('127.0.0.1',8767),RangeHandler).serve_forever()
